<svg xmlns="http://www.w3.org/2000/svg" width="900" height="20" viewBox="0 0 900 20" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#10b981"/>
      <stop offset="0.7" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="9" width="900" height="2" rx="1" fill="url(#line)"/>

  <circle r="9" cy="10" fill="url(#glow)">
    <animate attributeName="cx" values="-10;910" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="7" cy="10" fill="url(#glow)">
    <animate attributeName="cx" values="910;-10" dur="4.8s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(450,10)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      <rect x="-5" y="-5" width="10" height="10" fill="#10b981" transform="rotate(45)">
        <animate attributeName="fill" values="#10b981;#6366f1;#10b981" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
