<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
  </defs>

  <rect width="900" height="390" rx="20" fill="url(#bg)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="30" y="38" font-size="20" font-weight="700" fill="#ecfdf5">Impact per reused item</text>
    <text x="30" y="58" font-size="12" fill="#94a3b8">Calibrated category benchmarks · bar = average student value saved (₹)</text>
    <text x="880" y="58" font-size="12" fill="#94a3b8" text-anchor="end">landfill avoided</text>

    <!-- tracks -->
    <g fill="#1e293b">
      <rect x="290" y="84" width="460" height="18" rx="9"/>
      <rect x="290" y="132" width="460" height="18" rx="9"/>
      <rect x="290" y="180" width="460" height="18" rx="9"/>
      <rect x="290" y="228" width="460" height="18" rx="9"/>
      <rect x="290" y="276" width="460" height="18" rx="9"/>
      <rect x="290" y="324" width="460" height="18" rx="9"/>
    </g>

    <!-- labels -->
    <g font-size="15" fill="#e2e8f0">
      <text x="30" y="99">📚 Books &amp; Textbooks</text>
      <text x="30" y="147">🔧 Lab &amp; Project Hardware</text>
      <text x="30" y="195">✏️ Stationery &amp; Art</text>
      <text x="30" y="243">💻 Electronics</text>
      <text x="30" y="291">🛏️ Dorm Furniture</text>
      <text x="30" y="339">⚽ Sports &amp; Misc</text>
    </g>

    <!-- weights -->
    <g font-size="14" fill="#fbbf24" text-anchor="end" font-weight="600">
      <text x="880" y="99">1.2 kg</text>
      <text x="880" y="147">0.85 kg</text>
      <text x="880" y="195">0.4 kg</text>
      <text x="880" y="243">2.1 kg</text>
      <text x="880" y="291">4.8 kg</text>
      <text x="880" y="339">1.6 kg</text>
    </g>

    <!-- bars: width = value * 0.2 -->
    <rect x="290" y="84" width="0" height="18" rx="9" fill="url(#bar)">
      <animate attributeName="width" values="0;170;170;0" keyTimes="0;0.25;0.9;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="470" y="99" font-size="13" font-weight="700" fill="#a7f3d0" opacity="0">₹850
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.3;0.9;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>

    <rect x="290" y="132" width="0" height="18" rx="9" fill="url(#bar)">
      <animate attributeName="width" values="0;280;280;0" keyTimes="0;0.25;0.9;1" dur="9s" begin="0.25s" repeatCount="indefinite"/>
    </rect>
    <text x="580" y="147" font-size="13" font-weight="700" fill="#a7f3d0" opacity="0">₹1,400
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.3;0.9;1" dur="9s" begin="0.25s" repeatCount="indefinite"/>
    </text>

    <rect x="290" y="180" width="0" height="18" rx="9" fill="url(#bar)">
      <animate attributeName="width" values="0;90;90;0" keyTimes="0;0.25;0.9;1" dur="9s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text x="390" y="195" font-size="13" font-weight="700" fill="#a7f3d0" opacity="0">₹450
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.3;0.9;1" dur="9s" begin="0.5s" repeatCount="indefinite"/>
    </text>

    <rect x="290" y="228" width="0" height="18" rx="9" fill="url(#bar)">
      <animate attributeName="width" values="0;440;440;0" keyTimes="0;0.25;0.9;1" dur="9s" begin="0.75s" repeatCount="indefinite"/>
    </rect>
    <text x="740" y="243" font-size="13" font-weight="700" fill="#a7f3d0" opacity="0">₹2,200
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.3;0.9;1" dur="9s" begin="0.75s" repeatCount="indefinite"/>
    </text>

    <rect x="290" y="276" width="0" height="18" rx="9" fill="url(#bar)">
      <animate attributeName="width" values="0;360;360;0" keyTimes="0;0.25;0.9;1" dur="9s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="660" y="291" font-size="13" font-weight="700" fill="#a7f3d0" opacity="0">₹1,800
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.3;0.9;1" dur="9s" begin="1s" repeatCount="indefinite"/>
    </text>

    <rect x="290" y="324" width="0" height="18" rx="9" fill="url(#bar)">
      <animate attributeName="width" values="0;190;190;0" keyTimes="0;0.25;0.9;1" dur="9s" begin="1.25s" repeatCount="indefinite"/>
    </rect>
    <text x="490" y="339" font-size="13" font-weight="700" fill="#a7f3d0" opacity="0">₹950
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.3;0.9;1" dur="9s" begin="1.25s" repeatCount="indefinite"/>
    </text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
