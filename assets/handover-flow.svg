<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#052e2b"/>
    </linearGradient>
    <radialGradient id="dot">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="200" rx="20" fill="url(#bg)"/>

  <!-- base track (marching dashes) -->
  <line x1="90" y1="80" x2="810" y2="80" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- progress line -->
  <line x1="90" y1="80" x2="90" y2="80" stroke="#34d399" stroke-width="5" stroke-linecap="round">
    <animate attributeName="x2" values="90;810;810" keyTimes="0;0.65;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.85;0.97;1" dur="8s" repeatCount="indefinite"/>
  </line>

  <!-- nodes -->
  <g stroke="#34d399" stroke-width="3">
    <circle cx="90" cy="80" r="28" fill="#1e293b">
      <animate attributeName="fill" values="#1e293b;#1e293b;#10b981;#10b981;#1e293b" keyTimes="0;0.01;0.04;0.92;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="80" r="28" fill="#1e293b">
      <animate attributeName="fill" values="#1e293b;#1e293b;#10b981;#10b981;#1e293b" keyTimes="0;0.1625;0.1925;0.92;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="80" r="28" fill="#1e293b">
      <animate attributeName="fill" values="#1e293b;#1e293b;#10b981;#10b981;#1e293b" keyTimes="0;0.325;0.355;0.92;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="630" cy="80" r="28" fill="#1e293b">
      <animate attributeName="fill" values="#1e293b;#1e293b;#10b981;#10b981;#1e293b" keyTimes="0;0.4875;0.5175;0.92;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="810" cy="80" r="28" fill="#1e293b" stroke="#818cf8">
      <animate attributeName="fill" values="#1e293b;#1e293b;#6366f1;#6366f1;#1e293b" keyTimes="0;0.65;0.68;0.92;1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- final node ripple -->
  <circle cx="810" cy="80" r="28" fill="none" stroke="#818cf8" stroke-width="3" opacity="0">
    <animate attributeName="r" values="28;28;56;56" keyTimes="0;0.65;0.88;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0;0" keyTimes="0;0.65;0.88;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- node icons -->
  <g font-size="24" text-anchor="middle">
    <text x="90" y="89">📦</text>
    <text x="270" y="89">🙋</text>
    <text x="450" y="89">🛡️</text>
    <text x="630" y="89">📍</text>
    <text x="810" y="89">♻️</text>
  </g>

  <!-- labels -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g font-size="17" font-weight="700" fill="#ecfdf5">
      <text x="90" y="140">List</text>
      <text x="270" y="140">Request</text>
      <text x="450" y="140">Approve</text>
      <text x="630" y="140">Meet &amp; Confirm</text>
      <text x="810" y="140">Reused</text>
    </g>
    <g font-size="12" fill="#94a3b8">
      <text x="90" y="162">available</text>
      <text x="270" y="162">requested</text>
      <text x="450" y="162">reserved</text>
      <text x="630" y="162">giver ✓ + taker ✓</text>
      <text x="810" y="162">+ kg &amp; ₹ logged</text>
    </g>
  </g>

  <!-- traveling glow dot -->
  <circle cy="80" r="11" fill="url(#dot)">
    <animate attributeName="cx" values="90;810;810" keyTimes="0;0.65;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.65;0.7;1" dur="8s" repeatCount="indefinite"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
