<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e2b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="300" rx="22" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#a7f3d0">
    <circle cx="60" cy="40" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="260" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="50" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="30" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="250" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="270" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- headline -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="44" y="118" font-size="32" font-weight="700" fill="#ecfdf5">
      Give it a
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="44" y="162" font-size="38" font-weight="800" fill="#34d399">
      second life.
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="1.8s" fill="freeze"/>
    </text>
    <text x="44" y="198" font-size="14" fill="#94a3b8">
      Textbooks · Lab kits · Electronics · Furniture
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;1" dur="2.4s" fill="freeze"/>
    </text>
    <text x="44" y="226" font-size="13" fill="#64748b">Zero money. Zero waste. 100% campus.</text>
  </g>

  <!-- glow core -->
  <circle cx="550" cy="150" r="70" fill="url(#core)">
    <animate attributeName="r" values="60;78;60" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- flowing rings -->
  <circle cx="550" cy="150" r="80" fill="none" stroke="url(#ring)" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="150" r="108" fill="none" stroke="#6366f1" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 12">
    <animate attributeName="stroke-dashoffset" from="0" to="90" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- pulsing center -->
  <g transform="translate(550,150)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1" dur="2s" repeatCount="indefinite"/>
      <text text-anchor="middle" dy="15" font-size="46">♻️</text>
    </g>
  </g>

  <!-- orbiting items (counter-rotated to stay upright) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 550 150" to="360 550 150" dur="14s" repeatCount="indefinite"/>

    <g transform="translate(630,150)">
      <circle r="23" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite"/>
        <text text-anchor="middle" dy="8" font-size="22">📚</text></g>
    </g>
    <g transform="translate(550,230)">
      <circle r="23" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite"/>
        <text text-anchor="middle" dy="8" font-size="22">🔬</text></g>
    </g>
    <g transform="translate(470,150)">
      <circle r="23" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite"/>
        <text text-anchor="middle" dy="8" font-size="22">💻</text></g>
    </g>
    <g transform="translate(550,70)">
      <circle r="23" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite"/>
        <text text-anchor="middle" dy="8" font-size="22">🛏️</text></g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
